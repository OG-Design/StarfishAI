services:
  redis:
    image: redis:7-alpine
    container_name: starfish-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - starfishai-redis-data:/data
    networks:
      - starfish-network

volumes:
  starfishai-redis-data:
networks:
  starfish-network:
    name: starfish-network